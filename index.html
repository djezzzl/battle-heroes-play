<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a120a">
  <title>Battle Heroes</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <section id="setup" class="screen">
      <div class="panel setup-panel">
        <h1>Battle Heroes</h1>
        <p class="subtitle">Hire up to 7 creature stacks with your gold &mdash; a few mighty dragons or a horde of archers</p>
        <div id="faction-tabs"></div>
        <div id="unit-grid"></div>
      </div>
      <aside id="army-panel" class="panel">
        <h2 id="army-title">Your Army</h2>
        <div id="opponent-choice" class="enemy-choice">
          <span>Opponent:</span>
          <button class="toggle" data-opponent="computer" title="Fight the computer">&#129302; Computer</button>
          <button class="toggle" data-opponent="human" title="Hot-seat: two players take turns on this device">&#128101; Player 2</button>
        </div>
        <div id="budget-fixed" class="hidden"></div>
        <div class="budget" id="budget-edit">
          <div class="budget-label">Gold for this battle</div>
          <div id="budget-presets"></div>
          <label class="budget-custom">Custom: <input id="budget-input" type="number" min="100" step="500" inputmode="numeric"></label>
        </div>
        <div class="gold-bar"><div id="gold-fill"></div></div>
        <div id="gold-text"></div>
        <div id="army-list"></div>
        <div class="army-actions">
          <button id="btn-random-army" class="toggle" title="Random army from the current tab, spending the budget">&#127922; Random army</button>
          <button id="btn-clear-army" class="toggle">Clear</button>
        </div>
        <div class="enemy-choice" id="enemy-choice">
          <span>Enemy:</span>
          <button class="toggle" data-enemy="mirror" title="Same army as yours">Mirror</button>
          <button class="toggle" data-enemy="random" title="Random army spending at least 97% of the budget">Random</button>
        </div>
        <div class="enemy-choice hidden" id="p2-choice">
          <span>Player 2:</span>
          <button class="toggle" data-p2="mirror" title="Player 2 gets the same army as Player 1">Mirror my army</button>
          <button class="toggle" data-p2="build" title="Player 2 builds their own army with the same budget">Builds own army</button>
        </div>
        <div class="panel-bottom">
          <div class="audio-toggles">
            <button class="toggle audio-music" title="Music on/off (M)">&#127925;</button>
            <button class="toggle audio-sfx" title="Sound effects on/off (S)">&#128266;</button>
          </div>
          <button id="btn-back" class="toggle hidden" title="Back to Player 1's army">&#9664; Back</button>
          <button id="btn-start" class="btn-gold">To Battle!</button>
        </div>
      </aside>
    </section>

    <section id="battle" class="screen hidden">
      <div id="field-wrap"><canvas id="field"></canvas><div id="turn-banner" class="hidden"></div></div>
      <div id="hud">
        <div id="queue"></div>
        <div id="controls">
          <div class="btn-group">
            <button id="btn-retreat" class="btn-stone" title="Retreat (Esc)">&#9873;<span>Retreat</span></button>
            <button id="btn-auto" class="btn-stone" title="Auto combat (A)">&#9881;<span>Auto</span></button>
            <div class="audio-toggles stacked">
              <button class="btn-stone audio-music" title="Music on/off (M)">&#127925;</button>
              <button class="btn-stone audio-sfx" title="Sound effects on/off (S)">&#128266;</button>
            </div>
          </div>
          <div id="info"></div>
          <div id="log"></div>
          <div class="btn-group">
            <button id="btn-wait" class="btn-stone" title="Wait (W)">&#8987;<span>Wait</span></button>
            <button id="btn-defend" class="btn-stone" title="Defend (D)">&#128737;<span>Defend</span></button>
          </div>
        </div>
      </div>
    </section>

    <div id="modal" class="hidden"><div class="panel" id="modal-body"></div></div>
    <div id="unit-card" class="panel hidden"></div>
  </div>

  <script src="js/hex.js"></script>
  <script src="js/balance.js"></script>
  <script src="js/units.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/army.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/sprites/good.js"></script>
  <script src="js/sprites/evil.js"></script>
  <script src="js/sprites/wild.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
